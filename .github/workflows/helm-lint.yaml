name: Helm Chart Lint and Test

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.tpl'
      - 'Chart.yaml'
      - 'values.yaml'
  push:
    branches:
      - main
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.tpl'
      - 'Chart.yaml'
      - 'values.yaml'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: formbricks
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run chart-testing (lint)
        run: ct lint --charts charts/hub --validate-maintainers=false

      - name: Helm lint
        run: helm lint charts/hub

      - name: Helm template
        run: |
          helm template test charts/hub > /dev/null
          helm template test charts/hub --values examples/minimal-values.yaml > /dev/null
          helm template test charts/hub --values examples/production-values.yaml > /dev/null
          helm template test charts/hub --values examples/external-database.yaml > /dev/null

      - name: Initialize pgvector extension
        run: |
          PGPASSWORD=testpassword psql -h localhost -U formbricks -d hub -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=testpassword psql -h localhost -U formbricks -d hub -c "\dx"

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: helm-test

      - name: Test chart with external database
        run: |
          # Get Docker bridge gateway IP (how kind pods reach the host)
          HOST_IP=$(docker network inspect bridge --format='{{(index .IPAM.Config 0).Gateway}}')
          echo "Docker bridge gateway IP: $HOST_IP"

          # Verify PostgreSQL is accessible from this IP
          PGPASSWORD=testpassword psql -h $HOST_IP -U formbricks -d hub -c "SELECT 1;" || exit 1

          # Install chart with external database
          helm install hub-test charts/hub \
            --set cloudnativepg.enabled=false \
            --set externalDatabase.host=$HOST_IP \
            --set externalDatabase.port=5432 \
            --set externalDatabase.database=hub \
            --set externalDatabase.username=formbricks \
            --set externalDatabase.password=testpassword \
            --set hub.replicaCount=1 \
            --set hub.resources.requests.cpu=100m \
            --set hub.resources.requests.memory=128Mi \
            --set hub.podDisruptionBudget.enabled=false \
            --wait --timeout=5m

          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=hub --timeout=300s

          # Port forward and test health endpoint
          kubectl port-forward svc/hub-test 8080:80 &
          sleep 5
          curl -f http://localhost:8080/health || (kubectl logs -l app.kubernetes.io/name=hub && exit 1)

          # Cleanup
          helm uninstall hub-test
