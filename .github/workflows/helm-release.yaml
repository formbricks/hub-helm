name: Release Helm Chart

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Chart will be versioned as: $VERSION"

      - name: Update Chart.yaml with release version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version:.*/version: $VERSION/" charts/hub/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" charts/hub/Chart.yaml
          cat charts/hub/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package charts/hub --dependency-update
          echo "Packaged chart:"
          ls -lh *.tgz

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        run: |
          CHART_FILE=$(ls hub-*.tgz)
          helm push $CHART_FILE oci://ghcr.io/${{ github.repository_owner }}/charts
          echo "Chart pushed to: oci://ghcr.io/${{ github.repository_owner }}/charts/hub:${{ steps.version.outputs.version }}"

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "First release - generating full history"
            git log --pretty=format:"- %s (%h)" --no-merges > changelog.txt
          else
            echo "Generating changelog from ${PREVIOUS_TAG} to HEAD"
            git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges > changelog.txt
          fi

          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "hub-*.tgz"
          bodyFile: ""
          body: |
            ## Helm Chart for Formbricks Hub

            **Version:** ${{ steps.version.outputs.version }}

            ### Installation

            ```bash
            helm install hub oci://ghcr.io/${{ github.repository_owner }}/charts/hub --version ${{ steps.version.outputs.version }}
            ```

            ### Pull Chart

            ```bash
            helm pull oci://ghcr.io/${{ github.repository_owner }}/charts/hub --version ${{ steps.version.outputs.version }}
            ```

            ### Configuration

            See [values.yaml](https://github.com/${{ github.repository }}/blob/v${{ steps.version.outputs.version }}/charts/hub/values.yaml) for all configuration options.

            Example configurations:
            - [Minimal (development)](https://github.com/${{ github.repository }}/blob/v${{ steps.version.outputs.version }}/examples/minimal-values.yaml)
            - [Production (HA)](https://github.com/${{ github.repository }}/blob/v${{ steps.version.outputs.version }}/examples/production-values.yaml)
            - [External Database](https://github.com/${{ github.repository }}/blob/v${{ steps.version.outputs.version }}/examples/external-database.yaml)

            ### Changes in this Release

            ${{ steps.changelog.outputs.previous_tag != '' && format('**Changes since {0}:**', steps.changelog.outputs.previous_tag) || '**Initial release**' }}

            ${{ steps.changelog.outputs.previous_tag != '' && format('[View full diff]({0}/compare/{1}...v{2})', github.server_url, steps.changelog.outputs.previous_tag, steps.version.outputs.version) || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          makeLatest: true

      - name: Chart release summary
        run: |
          echo "## Helm Chart Released Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ghcr.io/${{ github.repository_owner }}/charts/hub" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation Command" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm install hub oci://ghcr.io/${{ github.repository_owner }}/charts/hub --version ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
